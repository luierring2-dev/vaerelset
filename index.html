<!doctype html>
<html lang="da" data-theme="neutral">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Værelset">
  <meta name="theme-color" content="#1c1c1e">
  <title>Værelset</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <section class="column">
      <div class="card clock-card">
        <div class="top-row">
          <span id="date"></span>
          <span class="top-actions">
            <span id="next-alarm"></span>
            <button id="night-toggle" class="icon-button" type="button" aria-label="Natfunktion">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
            </button>
            <button id="settings-open" class="icon-button" type="button" aria-label="Indstillinger">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
            </button>
          </span>
        </div>
        <div id="time">--:--</div>
      </div>

      <div class="card weather-card">
        <div class="weather-now">
          <span id="weather-temp"></span>
          <span id="weather-text"></span>
          <span id="weather-note"></span>
        </div>
        <ul id="weather-hours" class="forecast"></ul>
        <ul id="weather-days" class="forecast"></ul>
      </div>

      <div class="card todo-card">
        <h2>Huskeliste</h2>
        <ul id="todo-list"></ul>
        <form id="todo-form" class="inline-form">
          <input id="todo-input" type="text" maxlength="200" placeholder="Tilføj noget at huske" aria-label="Nyt punkt" autocomplete="off">
          <button type="submit">Tilføj</button>
        </form>
      </div>
    </section>

    <section class="card player-card">
      <div class="cover-frame">
        <img id="cover" alt="" hidden>
      </div>
      <div id="track-title">Intet spiller</div>
      <div id="track-artist"></div>
      <div class="controls">
        <button id="previous" class="icon-button large" type="button" aria-label="Forrige sang">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 5 9 12l10 7Z"/></svg>
        </button>
        <button id="play-pause" class="icon-button large" type="button" aria-label="Afspil">
          <svg id="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8Z"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M8 5v14M16 5v14"/></svg>
        </button>
        <button id="next" class="icon-button large" type="button" aria-label="Næste sang">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 5l10 7-10 7Z"/></svg>
        </button>
      </div>
      <div id="player-note"></div>
      <div class="player-actions">
        <button id="login" type="button" hidden>Log ind på Spotify</button>
        <a id="open-spotify" class="button" href="spotify:" hidden>Åbn Spotify</a>
      </div>
      <h2>Dine playlister</h2>
      <ul id="playlists"></ul>
    </section>
  </main>

  <div id="message" role="status" hidden></div>

  <div id="alarm-overlay" hidden>
    <div id="alarm-title">Vækkeur</div>
    <div id="alarm-reason"></div>
    <button id="alarm-stop" type="button">Stop</button>
  </div>

  <dialog id="settings">
    <form id="settings-form">
      <h2>Indstillinger</h2>

      <fieldset>
        <legend>Vejr</legend>
        <p id="place-current"></p>
        <div class="inline-form">
          <input id="city-input" type="text" placeholder="Skriv din by" aria-label="By" autocomplete="off">
          <button id="city-search" type="button">Søg</button>
        </div>
        <ul id="city-results"></ul>
      </fieldset>

      <fieldset>
        <legend>Spotify</legend>
        <label>Klient-id
          <input id="client-id" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
        </label>
        <p>Adresse til Spotifys udviklerside:</p>
        <code id="redirect-uri"></code>
        <p id="login-status"></p>
        <div class="button-row">
          <button id="settings-login" type="button">Log ind</button>
          <button id="logout" type="button">Log ud</button>
          <button id="export-code" type="button">Vis loginkode</button>
        </div>
        <textarea id="login-code" rows="2" placeholder="Indsæt loginkode fra Safari" aria-label="Loginkode" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
        <button id="import-code" type="button">Brug loginkode</button>
      </fieldset>

      <fieldset>
        <legend>Vækkeur</legend>
        <label class="check"><input id="alarm-enabled" type="checkbox"> Slået til</label>
        <label>Tidspunkt <input id="alarm-time" type="time"></label>
        <div id="alarm-days" class="button-row">
          <label class="check"><input type="checkbox" value="1"> Man</label>
          <label class="check"><input type="checkbox" value="2"> Tir</label>
          <label class="check"><input type="checkbox" value="3"> Ons</label>
          <label class="check"><input type="checkbox" value="4"> Tor</label>
          <label class="check"><input type="checkbox" value="5"> Fre</label>
          <label class="check"><input type="checkbox" value="6"> Lør</label>
          <label class="check"><input type="checkbox" value="0"> Søn</label>
        </div>
        <label>Playliste <select id="alarm-playlist"></select></label>
      </fieldset>

      <fieldset>
        <legend>Natfunktion</legend>
        <label>Fra <input id="night-start" type="time"></label>
        <label>Til <input id="night-end" type="time"></label>
      </fieldset>

      <fieldset>
        <legend>Udseende</legend>
        <label>Tema <select id="theme-select"></select></label>
        <label>Eget baggrundsbillede <input id="image-input" type="file" accept="image/*"></label>
        <button id="image-remove" type="button">Fjern billede</button>
      </fieldset>

      <div class="button-row dialog-actions">
        <button id="settings-cancel" type="button">Annullér</button>
        <button id="settings-save" type="button" class="primary">Gem</button>
      </div>
    </form>
  </dialog>

  <script type="module">
    import { start } from './js/app.js';

    start();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
  </script>
</body>
</html>
