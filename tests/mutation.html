  <style>
    body { font: 14px/1.5 monospace; margin: 16px; }
    iframe { position: absolute; left: -3000px; top: 0; }
  </style>
</head>
<body>
  <div id="status">Kører…</div>
  <pre id="survivors"></pre>
  <script type="module">
    // Hver linje er en fejl, testene skal opdage: fil, kode der ændres, og hvad den ændres til.
    const MUTATIONS = [
      ['js/alarm.js', 'age >= 0 && age <= DUE_WINDOW_MS', 'age >= 0'],

      ['js/alarm.js', "if (!alarm.playlistUri) throw new Error('Ingen playliste valgt');", ''],
      ['js/theme.js', 'current >= from || current < to', 'current >= from && current < to'],
      ['js/theme.js', 'if (override && now.getTime() < override.until) return override.value;', 'if (override) return override.value;'],
      ['js/theme.js', "usable = typeof image === 'string' && image.startsWith('data:image/')", "usable = typeof image === 'string'"],
      ['js/theme.js', 'Math.min(1, maxSide / Math.max(width, height))', 'maxSide / Math.max(width, height)'],
      ['js/theme.js', "if (root.style.getPropertyValue('--background-image') === value) return;", ''],
      ['js/spotify.js', "if (!pending || pending.state !== params.get('state')) {", 'if (!pending) {'],
      ['js/spotify.js', 'if (error instanceof AuthRequiredError) storage.remove(TOKENS_KEY);', 'storage.remove(TOKENS_KEY);'],
      ['js/spotify.js', 'if (error instanceof AuthRequiredError) storage.remove(TOKENS_KEY);', ''],
      ['js/spotify.js', 'if (pausedUntil > time()) throw new RateLimitError(pausedUntil - time());', ''],
      ['js/spotify.js', 'usable.find((device) => device.is_active) ??', ''],
      ['js/spotify.js', 'if (!refreshing) {', 'if (true) {'],
      ['js/spotify.js', 'refresh: json.refresh_token ?? previousRefresh,', 'refresh: json.refresh_token,'],
      ['js/spotify.js', 'current.expiresAt - EXPIRY_MARGIN_MS <= time()', 'false'],
      ['js/spotify.js', "code_challenge_method: 'S256',", ''],
      ['js/spotify.js', '{ context_uri: contextUri, ...(trackUri ? { offset: { uri: trackUri } } : {}) }', '{ context_uri: contextUri }'],
      ['js/spotify.js', 'startPlayback({ uris })', 'startPlayback({ context_uri: uris[0] })'],
      ['js/spotify.js', 'if (!(error instanceof NoDeviceError)) throw error;', ''],
      ['js/spotify.js', 'const preferred = getPreferredDeviceId();', 'const preferred = null;'],
      ['js/spotify.js', "typeof current.scope !== 'string' || ", ''],
      ['js/spotify.js', 'scope: json.scope ?? previousScope,', 'scope: json.scope ?? "",'],
      ['js/spotify.js', 'return SCOPES.some((required) => !granted.includes(required));', 'return false;'],
      ['js/spotify.js', 'entry && !entry.is_local', 'entry'],
      ['js/spotify.js', 'normalizeTrack(entry.item ?? entry.track)', 'normalizeTrack(entry.track)'],
      ['js/spotify.js', 'normalizeTrack(item, albumImage)', 'normalizeTrack(item)'],
      ['js/spotify.js', 'const ARTIST_ALBUMS_PAGE_SIZE = 10;', 'const ARTIST_ALBUMS_PAGE_SIZE = 20;'],
      ['js/spotify.js', 'const SEARCH_PAGE_SIZE = 10;', 'const SEARCH_PAGE_SIZE = 20;'],
      ['js/spotify.js', 'rows.filter((row, index) => rows.findIndex((other) => other.uri === row.uri) === index)', 'rows'],
      ['js/spotify.js', '.some((group) => group?.next)', '.every((group) => group?.next)'],
      ['js/spotify.js', '.filter((row) => row?.uri)', ''],
      ['js/web-player.js', "player.addListener('initialization_error', () => failForGood('initialization_error'));", "player.addListener('initialization_error', () => fail('initialization_error'));"],
      ['js/web-player.js', "player.addListener('account_error', () => failForGood('account_error'));", ''],
      ['js/web-player.js', 'if (started || unsupported) return;', 'if (unsupported) return;'],
      ['js/web-player.js', 'if (!player || activated) return;', 'if (!player) return;'],
      ['js/web-player.js', 'if (!connected) fail(\'connect\');', ''],
      ['js/web-player.js', ".catch(() => fail('connect'));", '.catch(() => {});'],
      ['js/web-player.js', "timer = setTimeout(() => fail('timeout'), timeoutMs);", ''],
      ['js/web-player.js', 'getToken().then(callback).catch(() => {});', 'getToken().then(callback);'],
      ['js/web-player.js', 'started = false;\n        fail(\'script\');', "fail('script');"],
      ['js/web-player.js', "player.addListener('autoplay_failed', () => onAutoplayFailed?.());", ''],
      ['js/music.js', 'section.rows.slice(start, start + MAX_QUEUE)', 'section.rows.slice(0, MAX_QUEUE)'],
      ['js/music.js', 'else if (view.contextUri) play(() => spotify.playContext(view.contextUri, row.uri));', 'else if (view.contextUri) play(() => spotify.playContext(view.contextUri));'],
      ['js/music.js', 'if (token !== loadToken) return;\n      appendSections', 'appendSections'],
      ['js/music.js', 'let section = sections.get(title);', 'let section = null;'],
      ['js/music.js', 'if (stack.at(-1)?.isSearch) stack.pop();', ''],
      ['js/music.js', 'if (!query) return;', ''],
      ['js/music.js', 'if (view.locked?.(error)) {', 'if (false) {'],
      ['js/music.js', "if (row.imageUrl?.startsWith('https://')) {", 'if (row.imageUrl) {'],
      ['js/music.js', "element('span', 'music-row-name', row.name)", "(() => { const n = element('span', 'music-row-name'); n.innerHTML = row.name; return n; })()"],
      ['js/music.js', "$('music-back').hidden = stack.length < 2;", "$('music-back').hidden = false;"],
      ['js/music.js', "$('music-play-all').hidden = !view.contextUri;", "$('music-play-all').hidden = false;"],
      ['js/music.js', "if (error instanceof AuthRequiredError) onAuthRequired();", ''],
      ['js/music.js', "$('music-more').hidden = result.nextOffset === null;", ''],
      ['js/music.js', "$('music-retry').hidden = false;", ''],
      ['js/music.js', "$('music').hidden = true;", ''],
      ['js/app.js', 'if (!playback?.isPlaying) ringAlarm(', 'if (false) ringAlarm('],
      ['js/app.js', 'setTimeout(verifyAlarmMusic, alarmCheckMs);', ''],
      ['js/app.js', "    } catch (error) {\n      ringAlarm(error);\n    }\n  }\n\n  function handleAutoplayFailed", "    } catch (error) {\n    }\n  }\n\n  function handleAutoplayFailed"],
      ['js/app.js', 'if (sinceAlarm < AUTOPLAY_ALARM_WINDOW_MS) ringAlarm', 'if (false) ringAlarm'],
      ['js/app.js', 'if (sinceAlarm < AUTOPLAY_ALARM_WINDOW_MS) ringAlarm', 'if (true) ringAlarm'],
      ['js/app.js', 'state.alarmStartedAt = now().getTime();', ''],
      ['js/app.js', "if (spotify.isLoggedIn() && !spotify.needsNewLogin()) webPlayer.start();", 'webPlayer.start();'],
      ['js/app.js', "if (spotify.isLoggedIn() && !spotify.needsNewLogin()) music.open();", 'music.open();'],
      ['js/app.js', "getPreferredDeviceId: () => webPlayer.getDeviceId(),", ''],
      ['js/app.js', "doc.addEventListener(type, () => webPlayer.activate(), { signal, capture: true });", ''],
      ['js/app.js', "const appNeeded = loggedIn && !webPlayer.getDeviceId() && (noDevice || !playback);", 'const appNeeded = loggedIn && (noDevice || !playback);'],
      ['js/app.js', "$('music-open').hidden = !loggedIn || needsNewLogin;", "$('music-open').hidden = !loggedIn;"],
      ['js/app.js', "onUnavailable: () => renderPlayer(),", ''],
      ['js/app.js', "webPlayer.stop();", ''],
      ['style.css', '#music-scroll {\n  flex: 1;\n  min-height: 0;', '#music-scroll {\n  flex: none;'],
      ['style.css', '.music-row-name, .music-row-subtitle, #music-now-title, #music-now-artist {\n  overflow: hidden;', '.music-row-name, .music-row-subtitle, #music-now-title, #music-now-artist {\n  overflow: visible;'],
      ['js/spotify.js', "if (response.status === 404 && path.startsWith('/me/player')) throw new NoDeviceError();", 'if (response.status === 404) throw new NoDeviceError();'],
      ['js/spotify.js', 'if (!json?.next) break;', ''],
      ['js/spotify.js', '(json?.items ?? []).filter(Boolean)', '(json?.items ?? [])'],
      ['js/spotify.js', "url.pathname.replace(/index\\.html$/, '')", 'url.pathname'],
      ['js/weather.js', 'time.getHours() % 3 === 0', 'true'],
      ['js/weather.js', 'cached?.place === place.name', 'cached'],
      ['js/weather.js', 'date.toDateString() !== now.toDateString() && date > now', 'true'],
      ['js/weather.js', 'Math.round(json.current.temperature_2m)', 'json.current.temperature_2m'],
      ['js/todo.js', '.slice(0, MAX_LENGTH)', ''],
      ['js/todo.js', "typeof item?.id === 'string' && typeof item?.text === 'string'", 'true'],
      ['js/settings.js', 'Number.isInteger(day) && day >= 0 && day <= 6', 'true'],
      ['js/settings.js', 'TIME_PATTERN.test(alarm.time) ? alarm.time : defaults.alarm.time', 'alarm.time'],
      ['js/clock.js', "padStart(2, '0')", "padStart(1, '0')"],
      ['js/storage.js', 'return raw === null || raw === undefined ? fallback : JSON.parse(raw);', 'return JSON.parse(raw);'],
      ['js/app.js', "playback?.coverUrl?.startsWith('https://') ? playback.coverUrl : null", 'playback?.coverUrl ?? null'],
      ['js/app.js', "storage.remove('night.override');", ''],
      ['js/app.js', 'if (state.polling || doc.hidden) return;', 'if (doc.hidden) return;'],
      ['js/app.js', 'if (state.polling || doc.hidden) return;', 'if (state.polling) return;'],
      ['js/app.js', 'if (!quiet) showMessage(errorText(error));', 'showMessage(errorText(error));'],
      ['js/app.js', 'alarmSound.start();', ''],
      ['js/app.js', 'if (!state.playlistsLoaded) await loadPlaylists();', ''],
      ['js/app.js', 'if (JSON.stringify(playlists) === JSON.stringify(state.playlists)) return;', ''],
      ['js/app.js', 'if (node.textContent !== text) node.textContent = text;', 'node.textContent = text;'],
      ['js/app.js', "if (doc.activeElement === $('city-input')) runCitySearch();", ''],
      ['js/app.js', "root.classList.remove('night-peek');", ''],
      ['js/app.js', "$('open-spotify').hidden = !appNeeded;", "$('open-spotify').hidden = true;"],
      ['js/app.js', ".has('error')) clearUrl();", ".has('error')) {}"],
      ['js/app.js', 'state.image = dataUrl;', ''],
      ['js/app.js', 'state.image = null;', ''],
      ['js/app.js', "const button = element('button', 'playlist-button', playlist.name);", "const button = element('button', 'playlist-button'); button.innerHTML = playlist.name;"],
      ['js/app.js', "$('login').hidden = loggedIn && !needsNewLogin;", "$('login').hidden = false;"],
      ['js/app.js', "$('login').hidden = loggedIn && !needsNewLogin;", "$('login').hidden = loggedIn;"],
      ['js/app.js', 'alarmTimer = setTimeout(stopAlarm, alarmMaxMs);', ''],
      ['js/app.js', 'setInterval(() => { if (state.weatherMissing) refreshWeather(); }, weatherRetryMs),', ''],
      ['js/app.js', 'if (state.weatherMissing) refreshWeather();', 'refreshWeather();'],
      ['js/app.js', 'setInterval(tickClock, SECOND),', ''],
      ['style.css', '.night:not(.night-peek) .player-card,', ''],
      ['style.css', 'height: 100dvh;', 'height: 150dvh;'],
    ];

    const sleep = (ms) => new Promise((resolve) => { setTimeout(resolve, ms); });

    async function runPage(path, limitMs) {
      const frame = document.createElement('iframe');
      frame.width = 1024;
      frame.height = 768;
      frame.src = `${path}?t=${Math.random()}`;
      document.body.append(frame);
      const started = Date.now();
      let summary = null;
      while (Date.now() - started < limitMs) {
        await sleep(100);
        summary = frame.contentWindow?.testSummary;
        if (summary) break;
      }
      frame.remove();
      return summary
        ? { passed: summary.passed, total: summary.total, failed: summary.failed.map((test) => test.name) }
        : { hang: true };
    }

    const report = { done: 0, total: MUTATIONS.length, results: [], baseline: null, finished: false };
    window.mutationReport = report;
    const status = document.getElementById('status');

    await fetch('/__reset');
    report.baseline = {
      logic: await runPage('/tests/index.html', 120000),
      e2e: await runPage('/tests/e2e.html', 120000),
    };

    for (const [file, from, to] of MUTATIONS) {
      const response = await fetch('/__mutate', { method: 'POST', body: JSON.stringify({ file, from, to }) });
      const { found } = await response.json();
      const result = { file, from, to, found, caughtBy: [] };
      if (found) {
        const pageOnly = file === 'js/app.js' || file === 'style.css';
        const pages = pageOnly ? ['/tests/e2e.html'] : ['/tests/index.html', '/tests/e2e.html'];
        for (const page of pages) {
          const outcome = await runPage(page, 40000);
          result.caughtBy = outcome.hang ? [`${page}: hænger`] : outcome.failed.slice(0, 2);
          if (result.caughtBy.length) break;
        }
      }
      report.results.push(result);
      report.done++;
      status.textContent = `${report.done} af ${report.total}`;
    }
    await fetch('/__reset');

    report.survivors = report.results.filter((result) => result.found && !result.caughtBy.length);
    report.notFound = report.results.filter((result) => !result.found);
    report.finished = true;
    status.textContent = `${report.total - report.survivors.length - report.notFound.length} af ${report.total} fejl fanget`;
    document.getElementById('survivors').textContent = JSON.stringify(report.survivors, null, 2);
  </script>
</body>
</html>
